name: belajar_bareng_ai
description: Aplikasi latihan soal pilihan ganda berbasis AI (offline-first).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.5.5
  file_picker: ^8.1.6
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
