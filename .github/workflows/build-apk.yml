name: Build Flutter APK

on:
  push:
    branches:
      - main # Ganti dengan master jika branch utama Anda bernama master
  workflow_dispatch: # Memungkinkan trigger manual dari GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode dari repositori
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Bersihkan disk space bawaan runner (fix "No space left on device")
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false # jangan hapus, Android SDK masih dipakai untuk build
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 3. Setup Java (disamakan dengan kebutuhan Android Gradle Plugin project ini)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 4. Setup Flutter
      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: 'stable' # Hanya mendukung 'stable' atau 'beta'
          version: 'latest' # Bisa diganti versi spesifik, mis. '3.24.0', untuk hasil lebih konsisten & cache SDK aktif
          cache: true
          cache-sdk: true

      # 5. Ambil dependencies proyek
      - name: Install dependencies
        run: flutter pub get

      # 6. Build APK Release
      - name: Build APK
        run: flutter build apk --release

      # 7. Upload APK sebagai Artifact agar bisa didownload dari halaman run
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: build/app/outputs/flutter-apk/app-release.apk

